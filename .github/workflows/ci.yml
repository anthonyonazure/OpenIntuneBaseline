name: Policy JSON Validation

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  validate-policy-json:
    runs-on: ubuntu-latest
    name: Validate Intune policy JSON exports
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install test dependencies
        run: pip install -r tests/requirements.txt

      - name: Run policy JSON validation suite
        run: pytest tests/ -v

  audit-tool:
    runs-on: ubuntu-latest
    name: Test the audit tool (Invoke-OIBAudit.ps1)
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Pester tests
        shell: pwsh
        run: |
          $result = Invoke-Pester -Path tests/Invoke-OIBAudit.Tests.ps1 -PassThru -Output Detailed
          if ($result.FailedCount -gt 0) { exit 1 }
